<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKD Prediction System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f4e79;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 13px 35px;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            background: #1f4e79;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f5f9;
            display: none;
            text-align: center;
        }

        .prediction {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .note {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Chronic Kidney Disease Prediction</h1>

    <p class="subtitle">
        Enter patient information to get the machine learning model output
    </p>

    <div class="form-grid">

        <div>
            <label>Age</label>
            <input type="number" id="age" value="48">
        </div>

        <div>
            <label>Blood Pressure</label>
            <input type="number" id="bp" value="80">
        </div>

        <div>
            <label>Specific Gravity</label>
            <input type="number" step="0.01" id="sg" value="1.02">
        </div>

        <div>
            <label>Albumin</label>
            <input type="number" id="al" value="1">
        </div>

        <div>
            <label>Sugar</label>
            <input type="number" id="su" value="0">
        </div>

        <div>
            <label>Blood Glucose Random</label>
            <input type="number" id="bgr" value="121">
        </div>

        <div>
            <label>Blood Urea</label>
            <input type="number" id="bu" value="36">
        </div>

        <div>
            <label>Serum Creatinine</label>
            <input type="number" step="0.1" id="sc" value="1.2">
        </div>

        <div>
            <label>Sodium</label>
            <input type="number" id="sod" value="137">
        </div>

        <div>
            <label>Potassium</label>
            <input type="number" step="0.1" id="pot" value="4.4">
        </div>

        <div>
            <label>Hemoglobin</label>
            <input type="number" step="0.1" id="hemo" value="15.4">
        </div>

        <div>
            <label>Packed Cell Volume</label>
            <input type="number" id="pcv" value="44">
        </div>

        <div>
            <label>White Blood Cell Count</label>
            <input type="number" id="wc" value="7800">
        </div>

        <div>
            <label>Red Blood Cell Count</label>
            <input type="number" step="0.1" id="rc" value="5.2">
        </div>

    </div>

    <div class="button-container">
        <button onclick="predictCKD()">Predict CKD</button>
    </div>

    <div id="result">
        <div class="prediction" id="prediction"></div>
        <div id="probability"></div>

        <div class="note">
            This is a machine learning model output and not a medical diagnosis.
        </div>
    </div>

</div>


<script>

async function predictCKD() {

    const data = {

        age: Number(document.getElementById("age").value),
        bp: Number(document.getElementById("bp").value),
        sg: Number(document.getElementById("sg").value),
        al: Number(document.getElementById("al").value),
        su: Number(document.getElementById("su").value),
        bgr: Number(document.getElementById("bgr").value),
        bu: Number(document.getElementById("bu").value),
        sc: Number(document.getElementById("sc").value),
        sod: Number(document.getElementById("sod").value),
        pot: Number(document.getElementById("pot").value),
        hemo: Number(document.getElementById("hemo").value),
        pcv: Number(document.getElementById("pcv").value),
        wc: Number(document.getElementById("wc").value),
        rc: Number(document.getElementById("rc").value)

    };

    const resultBox = document.getElementById("result");
    const predictionText = document.getElementById("prediction");
    const probabilityText = document.getElementById("probability");

    resultBox.style.display = "block";
    predictionText.innerText = "Predicting...";
    probabilityText.innerText = "";

    try {

        const response = await fetch(
            "https://ckd-api-j1s8.onrender.com/predict",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        if (result.prediction) {

            predictionText.innerText =
                "Prediction: " + result.prediction;

            probabilityText.innerText =
                "Model Probability: " +
                (result.model_output_probability * 100).toFixed(2) +
                "%";

        } else {

            predictionText.innerText =
                "Prediction failed";

            probabilityText.innerText =
                result.details || "Unknown error";
        }

    } catch (error) {

        predictionText.innerText =
            "Unable to connect to API";

        probabilityText.innerText =
            error.message;
    }
}

</script>

</body>
</html>
